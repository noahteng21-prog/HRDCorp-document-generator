
name: Build and Deploy T3 Generator

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/noahteng21-prog/hrdcorp-document-generator

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy to Tencent Lighthouse
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy and verify
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ghcr.io/noahteng21-prog/hrdcorp-document-generator:${{ github.sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: IMAGE,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -eu

            echo "$GHCR_TOKEN" | sudo docker login ghcr.io \
              -u "$GHCR_USERNAME" --password-stdin

            sudo docker pull "$IMAGE"

            # Remember the currently working image for rollback.
            OLD_IMAGE=$(sudo docker inspect \
              --format='{{.Image}}' hrdcorp-form-generator)

            # Stop and remove the old container.
            sudo docker stop hrdcorp-form-generator
            sudo docker rm hrdcorp-form-generator

            # Start the new version on the existing app port.
            if ! sudo docker run -d \
              --name hrdcorp-form-generator \
              --restart unless-stopped \
              -p 127.0.0.1:8501:8501 \
              "$IMAGE"; then

              echo "New container failed to start. Rolling back."
              sudo docker rm -f hrdcorp-form-generator 2>/dev/null || true
              sudo docker run -d \
                --name hrdcorp-form-generator \
                --restart unless-stopped \
                -p 127.0.0.1:8501:8501 \
                "$OLD_IMAGE"
              exit 1
            fi

            # Wait up to 60 seconds for the app to respond.
            HEALTHY=0
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8501/ \
                >/dev/null; then
                HEALTHY=1
                break
              fi
              sleep 2
            done

            if [ "$HEALTHY" -ne 1 ]; then
              echo "Health check failed. Rolling back."
              sudo docker rm -f hrdcorp-form-generator
              sudo docker run -d \
                --name hrdcorp-form-generator \
                --restart unless-stopped \
                -p 127.0.0.1:8501:8501 \
                "$OLD_IMAGE"
              exit 1
            fi

            echo "Deployment successful."
            sudo docker image prune -f
